name: Version Check

on:
  # Runs on pushes targeting a version
  push:
    branches: ["**v2.**"]

jobs:
  check_log:
    runs-on: ubuntu-slim
    steps:

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
            python-version: '3.12'

      - name: Get deps
        run: |
          pip install --upgrade pip
          pip install -y yaml

      - name: Get version
        id: ver
        run: |
          ver=$(echo ${{ github.ref }} | sed -r 's/.*v([0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?).*/\1/')
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      - name: Run checker
        run: |
          python utils/release_check.py ${{ steps.ver.outputs.version }}
